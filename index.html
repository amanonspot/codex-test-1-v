<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Important Question 💌</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1 class="title">Important Question 💌</h1>
      <img
        id="step-gif"
        class="gif"
        src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif"
        alt="Funny gif"
      />
      <p id="step-text" class="message">Tap next for a very serious proposal…</p>

      <button id="next-btn" class="btn primary">Next ➜</button>

      <section id="final-screen" class="hidden">
        <p class="final-text">Amisha, will you be my Valentine? 💘</p>
        <button id="yes-btn" class="btn success">Yes, absolutely 💖</button>
      </section>

      <section id="success-screen" class="hidden">
        <h2>YAY! Officially locked in 💞</h2>
        <p id="official-date"></p>
        <p id="storage-hint" class="storage-hint hidden"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
